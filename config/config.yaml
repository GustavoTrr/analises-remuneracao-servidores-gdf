# ============================================================
# FONTE DE DADOS
# ============================================================

fonte:
  base_url: "https://www.dados.df.gov.br/o/dados-abertos/v1.0"
  dataset: "portal-da-transparencia-remuneracao-dos-servidores"

  # Primeira competência considerada pelo projeto.
  data_inicial: "2022-01"


# ============================================================
# COLETA
# ============================================================

coleta:

  # Intervalo mínimo entre downloads consecutivos.
  intervalo_downloads_segundos: 2

  # Quantidade máxima de tentativas para erros temporários.
  max_tentativas: 3

  # Timeout para estabelecimento da conexão HTTP.
  timeout_conexao_segundos: 10

  # Timeout de leitura da resposta HTTP.
  timeout_leitura_segundos: 120


# ============================================================
# ARMAZENAMENTO
# ============================================================

armazenamento:
  pasta_raw: "./data/raw"

  pasta_logs: "./logs"

  arquivo_manifesto: "./data/manifest.jsonl"